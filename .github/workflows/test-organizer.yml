name: Smart File Organizer CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'organizer.sh'
      - 'organizer.ps1'
      - 'organizer.service'
      - 'organizer.path'
      - 'README.md'
      - '.github/workflows/test-organizer.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'organizer.sh'
      - 'organizer.ps1'
      - 'organizer.service'
      - 'organizer.path'
      - 'README.md'
      - '.github/workflows/test-organizer.yml'
  workflow_dispatch:

jobs:
  validate-linux:
    name: Linux validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bash syntax
        run: bash -n organizer.sh

      - name: Dry run with sample files
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          touch "$tmpdir/doc.pdf" "$tmpdir/notes.txt" "$tmpdir/cover.png" "$tmpdir/song.mp3" "$tmpdir/script.py"

          HOME="$tmpdir" ./organizer.sh --dry-run --source "$tmpdir" > output.txt 2>&1

          grep -Eq 'doc\.pdf|notes\.txt|cover\.png|song\.mp3' output.txt
          ! grep -Eq 'script\.py' output.txt

      - name: Validate service configuration
        run: |
          grep -q 'PathChanged' organizer.path
          grep -q 'WantedBy=default.target' organizer.service

  validate-windows:
    name: Windows validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run all supported categories
        run: |
          $dir = Join-Path $env:TEMP 'smartfile-ci'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -Path $dir -ItemType Directory -Force | Out-Null

          @(
            'doc.pdf','notes.txt','readme.md','report.docx',
            'slide.ppt','deck.pptx','data.xls','table.xlsx',
            'archive.zip','package.tar','song.mp3','video.mp4',
            'image.gif','vector.svg','screenshot_day.png',
            'A1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F4A5B6C7D8E9F0A1B2C3D4.jpg',
            'photo.jpg','script.py','app.ts'
          ) | ForEach-Object {
            New-Item -Path (Join-Path $dir $_) -ItemType File -Force | Out-Null
          }

          $output = .\organizer.ps1 -DryRun -Source $dir 2>&1
          $exit = $LASTEXITCODE
          Write-Output $output

          if ($exit -ne 0) { throw "organizer.ps1 exited with code $exit" }

          $expect = @(
            'Documents\PDFs', 'Documents\TXTs', 'Documents\MDs', 'Documents\DOCX',
            'Documents\PPTs', 'Documents\XL', 'Documents\Zipped', 'Music',
            'Videos', 'Pictures', 'Pictures\Screenshots', 'Pictures\Unnamed', 'Pictures\Named'
          )

          foreach ($item in $expect) {
            if ($output -notmatch [regex]::Escape($item)) {
              throw "Expected category not found: $item"
            }
          }

          if ($output -match 'script\.py' -or $output -match 'app\.ts') {
            throw 'Code files should not be moved by the organizer.'
          }

  package:
    name: Package release artifact
    needs:
      - validate-linux
      - validate-windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          tar -czf smart-file-org-${GITHUB_SHA::7}.tar.gz \
            README.md organizer.sh organizer.ps1 organizer.service organizer.path .github

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-file-org
          path: smart-file-org-${{ github.sha }}.tar.gz
